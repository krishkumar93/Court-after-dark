<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rubberDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="knurl" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 L6 3 M3 0 L3 6" stroke="#64748b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#spotlight)"/>

  <!-- Floor reflection ellipse -->
  <ellipse cx="400" cy="480" rx="320" ry="40" fill="#000" opacity="0.6"/>
  <ellipse cx="400" cy="475" rx="260" ry="25" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Dumbbell 1 (Main Foreground - Hex Dumbbell angled) -->
  <g transform="translate(400, 310) rotate(-18) translate(-400, -310)">
    <!-- Shadow under dumbbell -->
    <ellipse cx="400" cy="400" rx="200" ry="20" fill="#000" opacity="0.5"/>

    <!-- Left Hex Weight -->
    <!-- Back / 3D facet -->
    <polygon points="180,240 230,210 280,240 280,380 230,410 180,380" fill="url(#rubberDark)"/>
    <polygon points="150,255 200,225 250,255 250,395 200,425 150,395" fill="url(#rubber)" stroke="#334155" stroke-width="2"/>
    
    <!-- Left Hex Front Face -->
    <polygon points="170,250 215,224 260,250 260,370 215,396 170,370" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <polygon points="185,265 215,248 245,265 245,355 215,372 185,355" fill="#0b1120"/>
    <text x="215" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="1">10 KG</text>

    <!-- Chrome Handle Bar -->
    <rect x="250" y="295" width="290" height="30" rx="6" fill="url(#metal)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Knurled Grip Area -->
    <rect x="300" y="296" width="190" height="28" rx="4" fill="url(#knurl)"/>
    <!-- Chrome Highlights -->
    <line x1="260" y1="300" x2="530" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <line x1="260" y1="318" x2="530" y2="318" stroke="#000000" stroke-width="2" opacity="0.4"/>
    <!-- Grip Ring Collars -->
    <rect x="285" y="290" width="10" height="40" rx="3" fill="url(#metal)"/>
    <rect x="495" y="290" width="10" height="40" rx="3" fill="url(#metal)"/>

    <!-- Right Hex Weight -->
    <!-- Back / 3D facet -->
    <polygon points="530,240 580,210 630,240 630,380 580,410 530,380" fill="url(#rubberDark)"/>
    <polygon points="560,255 610,225 660,255 660,395 610,425 560,395" fill="url(#rubber)" stroke="#334155" stroke-width="2"/>
    
    <!-- Right Hex Front Face -->
    <polygon points="570,250 615,224 660,250 660,370 615,396 570,370" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <polygon points="585,265 615,248 645,265 645,355 615,372 585,355" fill="#0b1120"/>
    <text x="615" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="1">10 KG</text>
  </g>

  <!-- Secondary Background Dumbbell (Perpendicular) -->
  <g transform="translate(320, 430) rotate(35) scale(0.65)">
    <rect x="250" y="295" width="280" height="28" rx="5" fill="url(#metal)"/>
    <rect x="170" y="240" width="90" height="140" rx="20" fill="url(#rubberDark)"/>
    <rect x="520" y="240" width="90" height="140" rx="20" fill="url(#rubberDark)"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#091222" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="2">HEX DUMBBELL PAIR</text>
  </g>
</svg>
