<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a"/>
      <stop offset="50%" stop-color="#020d14"/>
      <stop offset="100%" stop-color="#010508"/>
    </linearGradient>
    <radialGradient id="courtGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#courtGlow)"/>

  <ellipse cx="400" cy="510" rx="300" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="220" ry="20" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Badminton Racket (Angled) -->
  <g id="badmintonRacket" transform="translate(360, 260) rotate(-35)">
    <!-- Shadow -->
    <ellipse cx="15" cy="15" rx="100" ry="125" fill="#000000" opacity="0.35"/>

    <!-- Oval Head Frame (Outer) -->
    <ellipse cx="0" cy="-70" rx="105" ry="135" fill="none" stroke="url(#frameGradient)" stroke-width="10"/>
    <ellipse cx="0" cy="-70" rx="98" ry="128" fill="#030c14" opacity="0.6"/>

    <!-- String Bed Mesh (Vertical and Horizontal Lines) -->
    <g stroke="#a5f3fc" stroke-width="1" opacity="0.75">
      <!-- Verticals -->
      <line x1="-70" y1="-120" x2="-70" y2="-20"/>
      <line x1="-50" y1="-150" x2="-50" y2="10"/>
      <line x1="-30" y1="-170" x2="-30" y2="30"/>
      <line x1="-10" y1="-180" x2="-10" y2="40"/>
      <line x1="10" y1="-180" x2="10" y2="40"/>
      <line x1="30" y1="-170" x2="30" y2="30"/>
      <line x1="50" y1="-150" x2="50" y2="10"/>
      <line x1="70" y1="-120" x2="70" y2="-20"/>

      <!-- Horizontals -->
      <line x1="-60" y1="-150" x2="60" y2="-150"/>
      <line x1="-80" y1="-130" x2="80" y2="-130"/>
      <line x1="-90" y1="-110" x2="90" y2="-110"/>
      <line x1="-95" y1="-90" x2="95" y2="-90"/>
      <line x1="-95" y1="-70" x2="95" y2="-70"/>
      <line x1="-95" y1="-50" x2="95" y2="-50"/>
      <line x1="-90" y1="-30" x2="90" y2="-30"/>
      <line x1="-80" y1="-10" x2="80" y2="-10"/>
      <line x1="-60" y1="10" x2="60" y2="10"/>
    </g>

    <!-- T-Joint -->
    <polygon points="-12,65 12,65 8,90 -8,90" fill="url(#frameGradient)"/>
    <text x="0" y="82" font-family="system-ui" font-size="7" font-weight="900" fill="#0891b2" text-anchor="middle">BWF</text>

    <!-- Slim Carbon Shaft -->
    <rect x="-4" y="90" width="8" height="150" rx="3" fill="url(#frameGradient)"/>
    <!-- Shaft highlight -->
    <line x1="-1" y1="90" x2="-1" y2="240" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Handle Grip (Black cushioned PU grip with Cyan Wrap) -->
    <rect x="-8" y="240" width="16" height="110" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Wrap Ribbons -->
    <g stroke="#06b6d4" stroke-width="2" opacity="0.8">
      <line x1="-8" y1="260" x2="8" y2="252"/>
      <line x1="-8" y1="280" x2="8" y2="272"/>
      <line x1="-8" y1="300" x2="8" y2="292"/>
      <line x1="-8" y1="320" x2="8" y2="312"/>
      <line x1="-8" y1="340" x2="8" y2="332"/>
    </g>
    <!-- Butt Cap -->
    <ellipse cx="0" cy="350" rx="9" ry="4" fill="#22d3ee"/>
  </g>

  <!-- Shuttlecock near the racket -->
  <g id="shuttle" transform="translate(530, 360) rotate(40)">
    <ellipse cx="0" cy="40" rx="35" ry="12" fill="#000000" opacity="0.45"/>
    <!-- Feathers -->
    <polygon points="-28,-50 28,-50 15,10 -15,10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="-28" y1="-30" x2="28" y2="-30" stroke="#ef4444" stroke-width="2"/>
    <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Cork Base -->
    <ellipse cx="0" cy="14" rx="15" ry="14" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#031118" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#22d3ee" text-anchor="middle" letter-spacing="2">BADMINTON RACKET</text>
  </g>
</svg>
