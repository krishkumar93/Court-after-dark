<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12080a"/>
      <stop offset="50%" stop-color="#0d0406"/>
      <stop offset="100%" stop-color="#030102"/>
    </linearGradient>
    <radialGradient id="ttGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redRubber" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <linearGradient id="handleWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="35%" stop-color="#fef3c7"/>
      <stop offset="65%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="ttBall" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#ttGlow)"/>

  <!-- Floor reflection -->
  <ellipse cx="400" cy="510" rx="280" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="200" ry="20" fill="#ef4444" opacity="0.1" filter="url(#glow)"/>

  <!-- Table Tennis Paddle (Angled) -->
  <g id="ttBat" transform="translate(370, 270) rotate(-22)">
    <!-- Shadow -->
    <ellipse cx="15" cy="15" rx="135" ry="155" fill="#000000" opacity="0.4"/>

    <!-- Wood Blade Edge Ply -->
    <ellipse cx="0" cy="-30" rx="142" ry="162" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="140" ry="160" fill="#1e293b"/>

    <!-- Red Rubber Sponge Face -->
    <ellipse cx="0" cy="-30" rx="136" ry="156" fill="url(#redRubber)" stroke="#b91c1c" stroke-width="2"/>

    <!-- Edge Tape (Black protective rim) -->
    <path d="M -136,-30 C -136,-115 136,-115 136,-30" fill="none" stroke="#0f172a" stroke-width="4"/>

    <!-- Paddle Rubber Sheen / Highlight -->
    <ellipse cx="-45" cy="-80" rx="55" ry="35" transform="rotate(-30, -45, -80)" fill="#ffffff" opacity="0.25" filter="url(#glow)"/>

    <!-- Rubber Branding Emblem -->
    <g transform="translate(0, 75)">
      <rect x="-35" y="-12" width="70" height="22" rx="4" fill="#0f172a" opacity="0.85"/>
      <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CARBON 3★</text>
    </g>

    <!-- Flared Handle -->
    <!-- Handle Shadow -->
    <polygon points="-24,105 24,105 32,235 -32,235" fill="#000000" opacity="0.3"/>
    <!-- Handle Base Ply Wood -->
    <polygon points="-22,100 22,100 30,230 -30,230" fill="url(#handleWood)" stroke="#92400e" stroke-width="2"/>
    <!-- Handle Inlay Grip Stripe (Sporty Cyan/Black) -->
    <polygon points="-8,100 8,100 12,230 -12,230" fill="#0f172a"/>
    <polygon points="-3,100 3,100 4,230 -4,230" fill="#06b6d4"/>
    <!-- Handle End Cap -->
    <ellipse cx="0" cy="230" rx="30" ry="8" fill="#78350f"/>
    <circle cx="0" cy="230" r="4" fill="#f59e0b"/>
  </g>

  <!-- 3-Star Table Tennis Ball -->
  <g id="ttBall" transform="translate(560, 390)">
    <!-- Ball Shadow -->
    <ellipse cx="0" cy="38" rx="42" ry="14" fill="#000000" opacity="0.6"/>
    <!-- Ball Sphere -->
    <circle cx="0" cy="0" r="38" fill="url(#ttBall)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- 3 Stars Logo on Ball -->
    <g transform="translate(0, -2)">
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#d97706" text-anchor="middle">★★★</text>
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#64748b" text-anchor="middle">40+</text>
    </g>
    <!-- Highlight -->
    <ellipse cx="-12" cy="-14" rx="10" ry="6" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#120508" stroke="#ef4444" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f87171" text-anchor="middle" letter-spacing="2">TABLE TENNIS BAT</text>
  </g>
</svg>
