<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b03"/>
      <stop offset="50%" stop-color="#100702"/>
      <stop offset="100%" stop-color="#040200"/>
    </linearGradient>
    <radialGradient id="hoopGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bballLeather" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#hoopGlow)"/>

  <ellipse cx="400" cy="505" rx="300" ry="45" fill="#000000" opacity="0.65"/>
  <ellipse cx="400" cy="500" rx="220" ry="25" fill="#ea580c" opacity="0.12" filter="url(#glow)"/>

  <!-- Basketball Sphere & Ribbed Seams -->
  <g id="basketball" transform="translate(400, 285)">
    <!-- Ball Sphere -->
    <circle cx="0" cy="0" r="165" fill="url(#bballLeather)" stroke="#1c1917" stroke-width="3"/>

    <!-- Black Ribbed Channel Seams -->
    <!-- Horizontal Cross -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#1c1917" stroke-width="5"/>
    <!-- Vertical Cross -->
    <line x1="0" y1="-165" x2="0" y2="165" stroke="#1c1917" stroke-width="5"/>
    <!-- Left Curve Seam -->
    <path d="M -115,-118 C -35,-80 -35,80 -115,118" stroke="#1c1917" stroke-width="5" fill="none"/>
    <!-- Right Curve Seam -->
    <path d="M 115,-118 C 35,-80 35,80 115,118" stroke="#1c1917" stroke-width="5" fill="none"/>

    <!-- Subtle White Seam Groove Highlight -->
    <line x1="-165" y1="-2" x2="165" y2="-2" stroke="#fdba74" stroke-width="1.2" opacity="0.4"/>
    <line x1="-2" y1="-165" x2="-2" y2="165" stroke="#fdba74" stroke-width="1.2" opacity="0.4"/>

    <!-- Wilson Evolution Style Logo -->
    <g transform="translate(0, -35)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" font-style="italic" fill="#fef08a" text-anchor="middle" letter-spacing="3">EVOLUTION</text>
      <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#fed7aa" text-anchor="middle" letter-spacing="2">OFFICIAL INDOOR GAME BALL</text>
    </g>

    <!-- Light reflection shine -->
    <ellipse cx="-60" cy="-60" rx="55" ry="32" transform="rotate(-30, -60, -60)" fill="#ffffff" opacity="0.32" filter="url(#glow)"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#180702" stroke="#ea580c" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fb923c" text-anchor="middle" letter-spacing="2">MATCH BASKETBALL</text>
  </g>
</svg>
