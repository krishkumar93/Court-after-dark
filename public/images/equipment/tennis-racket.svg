<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070c1b"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <radialGradient id="courtGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tennisFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="feltBall" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#a3e635"/>
      <stop offset="85%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#365314"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#courtGlow)"/>

  <ellipse cx="400" cy="510" rx="300" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="220" ry="20" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>

  <!-- Tennis Racket (Angled) -->
  <g id="tennisRacket" transform="translate(370, 260) rotate(-32)">
    <!-- Shadow -->
    <ellipse cx="15" cy="15" rx="115" ry="145" fill="#000000" opacity="0.4"/>

    <!-- Aerodynamic Frame (Isometric) -->
    <ellipse cx="0" cy="-60" rx="120" ry="150" fill="none" stroke="url(#tennisFrame)" stroke-width="14"/>
    <ellipse cx="0" cy="-60" rx="112" ry="142" fill="#030816" opacity="0.5"/>

    <!-- Tight String Grid -->
    <g stroke="#93c5fd" stroke-width="1.2" opacity="0.75">
      <!-- Verticals -->
      <line x1="-80" y1="-110" x2="-80" y2="-10"/>
      <line x1="-60" y1="-150" x2="-60" y2="30"/>
      <line x1="-40" y1="-175" x2="-40" y2="55"/>
      <line x1="-20" y1="-195" x2="-20" y2="75"/>
      <line x1="0" y1="-205" x2="0" y2="85"/>
      <line x1="20" y1="-195" x2="20" y2="75"/>
      <line x1="40" y1="-175" x2="40" y2="55"/>
      <line x1="60" y1="-150" x2="60" y2="30"/>
      <line x1="80" y1="-110" x2="80" y2="-10"/>

      <!-- Horizontals -->
      <line x1="-70" y1="-170" x2="70" y2="-170"/>
      <line x1="-90" y1="-140" x2="90" y2="-140"/>
      <line x1="-105" y1="-110" x2="105" y2="-110"/>
      <line x1="-112" y1="-80" x2="112" y2="-80"/>
      <line x1="-115" y1="-50" x2="115" y2="-50"/>
      <line x1="-112" y1="-20" x2="112" y2="-20"/>
      <line x1="-105" y1="10" x2="105" y2="10"/>
      <line x1="-90" y1="40" x2="90" y2="40"/>
      <line x1="-65" y1="70" x2="65" y2="70"/>
    </g>

    <!-- Throat / Yoke -->
    <path d="M -50,85 C -20,110 -15,130 -12,145 L 12,145 C 15,130 20,110 50,85 Z" fill="url(#tennisFrame)"/>
    <ellipse cx="0" cy="98" rx="28" ry="16" fill="#030816"/>

    <!-- Ergonomic Shaft -->
    <rect x="-14" y="145" width="28" height="55" rx="4" fill="url(#tennisFrame)"/>

    <!-- Octagonal Cushion Grip Handle -->
    <rect x="-16" y="200" width="32" height="150" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Grip Wrap Contours -->
    <g stroke="#3b82f6" stroke-width="2.5" opacity="0.8">
      <line x1="-16" y1="225" x2="16" y2="215"/>
      <line x1="-16" y1="255" x2="16" y2="245"/>
      <line x1="-16" y1="285" x2="16" y2="275"/>
      <line x1="-16" y1="315" x2="16" y2="305"/>
      <line x1="-16" y1="345" x2="16" y2="335"/>
    </g>
    <!-- Butt Cap with W/Babolat crest -->
    <ellipse cx="0" cy="350" rx="18" ry="7" fill="#2563eb"/>
  </g>

  <!-- Fluorescent Tennis Ball -->
  <g id="tennisBall" transform="translate(540, 390)">
    <ellipse cx="0" cy="40" rx="45" ry="14" fill="#000000" opacity="0.6"/>
    <!-- Ball Core -->
    <circle cx="0" cy="0" r="42" fill="url(#feltBall)" stroke="#4d7c0f" stroke-width="2"/>
    <!-- White Curved Seam Line -->
    <path d="M -30,-25 C -5,0 -5,25 -25,32" stroke="#f8fafc" stroke-width="3" fill="none"/>
    <path d="M 30,-25 C 5,0 5,25 25,32" stroke="#f8fafc" stroke-width="3" fill="none"/>
    <!-- Highlight -->
    <ellipse cx="-14" cy="-14" rx="12" ry="7" fill="#ffffff" opacity="0.45" filter="url(#glow)"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#050d1e" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#60a5fa" text-anchor="middle" letter-spacing="2">PRO TENNIS RACKET</text>
  </g>
</svg>
