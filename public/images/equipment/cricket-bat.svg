<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b08"/>
      <stop offset="50%" stop-color="#0e0705"/>
      <stop offset="100%" stop-color="#040201"/>
    </linearGradient>
    <radialGradient id="pitchGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="willowWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="30%" stop-color="#f5deb3"/>
      <stop offset="70%" stop-color="#e8cca4"/>
      <stop offset="100%" stop-color="#b89358"/>
    </linearGradient>
    <linearGradient id="handleGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cricketBall" x1="30%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="90%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="stickerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#pitchGlow)"/>

  <!-- Floor reflection -->
  <ellipse cx="400" cy="510" rx="300" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="220" ry="20" fill="#f59e0b" opacity="0.1" filter="url(#glow)"/>

  <!-- English Willow Cricket Bat (Positioned dynamically at angle) -->
  <g id="cricketBat" transform="translate(370, 275) rotate(-32)">
    <!-- Bat Drop Shadow -->
    <rect x="-35" y="-170" width="85" height="420" rx="16" fill="#000000" opacity="0.45" transform="translate(20, 20)"/>

    <!-- Blade (Main English Willow Wood) -->
    <path d="M -30,-60 L 35,-60 Q 45,-55 45,-40 L 40,240 Q 38,255 25,258 L -20,258 Q -35,255 -35,240 L -35,-40 Q -35,-55 -30,-60 Z"
          fill="url(#willowWood)" stroke="#8c6d3b" stroke-width="2"/>

    <!-- Wood Grains -->
    <line x1="-22" y1="-50" x2="-24" y2="245" stroke="#a27b46" stroke-width="1.2" opacity="0.6"/>
    <line x1="-10" y1="-50" x2="-11" y2="248" stroke="#936c39" stroke-width="1.2" opacity="0.5"/>
    <line x1="5" y1="-50" x2="3" y2="250" stroke="#a27b46" stroke-width="1.5" opacity="0.6"/>
    <line x1="18" y1="-50" x2="16" y2="248" stroke="#8c6432" stroke-width="1.2" opacity="0.5"/>
    <line x1="30" y1="-50" x2="28" y2="242" stroke="#a27b46" stroke-width="1.2" opacity="0.6"/>

    <!-- Bat Shoulder Shaping -->
    <path d="M -30,-60 Q -5,-75 0,-85 Q 5,-75 35,-60 Z" fill="#936c39"/>

    <!-- Handle Cane & Rubber Grip -->
    <rect x="-10" y="-220" width="22" height="140" rx="9" fill="url(#handleGrip)" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Grip Chevron / Spiral pattern rings -->
    <g stroke="#0284c7" stroke-width="2" opacity="0.7">
      <line x1="-10" y1="-205" x2="12" y2="-205"/>
      <line x1="-10" y1="-190" x2="12" y2="-190"/>
      <line x1="-10" y1="-175" x2="12" y2="-175"/>
      <line x1="-10" y1="-160" x2="12" y2="-160"/>
      <line x1="-10" y1="-145" x2="12" y2="-145"/>
      <line x1="-10" y1="-130" x2="12" y2="-130"/>
      <line x1="-10" y1="-115" x2="12" y2="-115"/>
      <line x1="-10" y1="-100" x2="12" y2="-100"/>
    </g>
    <!-- Handle Top Grip Cap -->
    <ellipse cx="1" cy="-220" rx="11" ry="5" fill="#38bdf8"/>

    <!-- Premium Bat Stickers / Brand Chevron -->
    <!-- Upper Brand Sticker -->
    <rect x="-24" y="-30" width="50" height="90" rx="8" fill="#0f172a" stroke="url(#stickerGold)" stroke-width="2"/>
    <polygon points="1,-20 18,-2 1,-2 -16,-2" fill="url(#stickerGold)"/>
    <text x="1" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">PRO</text>
    <text x="1" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">WILLOW</text>

    <!-- Lower Sweetspot Shield -->
    <polygon points="1,110 22,130 14,165 1,180 -12,165 -20,130" fill="url(#stickerGold)" opacity="0.85"/>
    <text x="1" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">GRADE 1</text>

    <!-- Toe Guard at bottom -->
    <path d="M -35,235 L 40,235 L 35,258 L -30,258 Z" fill="#0f172a" opacity="0.9"/>
  </g>

  <!-- Red Leather Cricket Ball beside the bat -->
  <g id="cricketBall" transform="translate(525, 410)">
    <!-- Shadow -->
    <ellipse cx="0" cy="48" rx="55" ry="16" fill="#000000" opacity="0.6"/>
    <!-- Ball Base -->
    <circle cx="0" cy="0" r="48" fill="url(#cricketBall)" stroke="#4c0519" stroke-width="2"/>
    <!-- Raised White Stitched Seam -->
    <path d="M -34,-34 C -10,-10 10,10 34,34" stroke="#f8fafc" stroke-width="3" stroke-dasharray="4,3"/>
    <path d="M -34,-34 C -10,-10 10,10 34,34" stroke="#be123c" stroke-width="1.2" opacity="0.8"/>
    <!-- Shine highlight -->
    <ellipse cx="-16" cy="-18" rx="14" ry="8" transform="rotate(-40, -16, -18)" fill="#ffffff" opacity="0.4" filter="url(#glow)"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#140a05" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="2">ENGLISH WILLOW BAT</text>
  </g>
</svg>
