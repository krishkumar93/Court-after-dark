<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e05"/>
      <stop offset="50%" stop-color="#100803"/>
      <stop offset="100%" stop-color="#050201"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="coneLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="40%" stop-color="#bef264"/>
      <stop offset="70%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <ellipse cx="400" cy="510" rx="280" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="200" ry="20" fill="#f97316" opacity="0.1"/>

  <!-- Stack of Agility Training Marker Cones -->
  <g id="cones" transform="translate(400, 300)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="140" rx="160" ry="35" fill="#000000" opacity="0.5"/>

    <!-- Bottom Lime Cone -->
    <path d="M -150,130 C -150,155 150,155 150,130 L 40,40 C 20,30 -20,30 -40,40 Z" fill="url(#coneLime)" stroke="#3f6212" stroke-width="2"/>
    <ellipse cx="0" cy="40" rx="36" ry="12" fill="#bef264"/>
    <circle cx="0" cy="40" r="14" fill="#14532d"/>

    <!-- Middle Orange Cone (Stacked) -->
    <path d="M -135,95 C -135,120 135,120 135,95 L 35,5 C 18,-5 -18,-5 -35,5 Z" fill="url(#coneOrange)" stroke="#9a3412" stroke-width="2"/>
    <ellipse cx="0" cy="5" rx="32" ry="10" fill="#fed7aa"/>
    <circle cx="0" cy="5" r="12" fill="#7c2d12"/>

    <!-- Top Orange Cone (Stacked) -->
    <path d="M -120,60 C -120,85 120,85 120,60 L 30,-30 C 15,-40 -15,-40 -30,-30 Z" fill="url(#coneOrange)" stroke="#9a3412" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="28" ry="9" fill="#fed7aa"/>
    <circle cx="0" cy="-30" r="10" fill="#7c2d12"/>

    <!-- Carrying Wire Strap Handle Through Cones -->
    <path d="M 0,-30 L 0,-140 C 0,-165 40,-165 40,-140 L 40,-30" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="20" cy="-160" rx="25" ry="12" fill="none" stroke="#e2e8f0" stroke-width="6"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#150802" stroke="#f97316" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fb923c" text-anchor="middle" letter-spacing="2">AGILITY TRAINING CONES</text>
  </g>
</svg>
