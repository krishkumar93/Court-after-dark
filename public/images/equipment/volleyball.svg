<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <radialGradient id="courtGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bluePanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="yellowPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="sphereShadow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#courtGlow)"/>

  <!-- Floor reflection -->
  <ellipse cx="400" cy="505" rx="300" ry="45" fill="#000" opacity="0.65"/>
  <ellipse cx="400" cy="500" rx="220" ry="25" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>

  <!-- Volleyball Sphere & Curved Aerodynamic Panels -->
  <g id="volleyball" transform="translate(400, 285)">
    <!-- Clip path to keep curved panels strictly within the ball's circumference -->
    <clipPath id="ballClip">
      <circle cx="0" cy="0" r="165"/>
    </clipPath>

    <!-- Base Ball Outer -->
    <circle cx="0" cy="0" r="165" fill="#1e293b" stroke="#0f172a" stroke-width="4"/>

    <!-- Clipped Panels Group -->
    <g clip-path="url(#ballClip)">
      <!-- Swirl Panel Group 1 (Top Left Blue) -->
      <path d="M -170,-170 Q 0,-30 40,-170 Z" fill="url(#bluePanel)" stroke="#0f172a" stroke-width="2.5"/>
      <path d="M -170,-90 Q -20,-10 90,-170 Z" fill="url(#yellowPanel)" stroke="#0f172a" stroke-width="2.5"/>
      <path d="M -170,-20 Q -40,30 140,-140 Z" fill="url(#bluePanel)" stroke="#0f172a" stroke-width="2.5"/>

      <!-- Swirl Panel Group 2 (Center Wave Gold & Blue) -->
      <path d="M -170,50 Q 10,70 170,-90 Z" fill="url(#yellowPanel)" stroke="#0f172a" stroke-width="2.5"/>
      <path d="M -170,110 Q 30,120 170,-20 Z" fill="url(#bluePanel)" stroke="#0f172a" stroke-width="2.5"/>
      <path d="M -130,170 Q 50,160 170,40 Z" fill="url(#yellowPanel)" stroke="#0f172a" stroke-width="2.5"/>

      <!-- Swirl Panel Group 3 (Bottom Arc Blue & Yellow) -->
      <path d="M -50,170 Q 90,140 170,100 Z" fill="url(#bluePanel)" stroke="#0f172a" stroke-width="2.5"/>
      <path d="M 30,170 Q 130,150 170,160 Z" fill="url(#yellowPanel)" stroke="#0f172a" stroke-width="2.5"/>

      <!-- Mikasa Style Center Crest -->
      <g transform="translate(10, 10) rotate(-20)">
        <rect x="-42" y="-14" width="84" height="28" rx="6" fill="#0b1120" stroke="#facc15" stroke-width="1.5" opacity="0.9"/>
        <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="1">MIKASA</text>
      </g>

      <!-- 3D Spherical Volume Overlay -->
      <circle cx="0" cy="0" r="165" fill="url(#sphereShadow)"/>
    </g>

    <!-- Ball Outer Ring Accent -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#334155" stroke-width="2"/>

    <!-- Light reflection highlight -->
    <ellipse cx="-60" cy="-60" rx="55" ry="32" transform="rotate(-30, -60, -60)" fill="#ffffff" opacity="0.3" filter="url(#glow)"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#081022" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="2">COMPETITION VOLLEYBALL</text>
  </g>
</svg>
