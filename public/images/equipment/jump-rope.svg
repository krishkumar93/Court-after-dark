<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d1c"/>
      <stop offset="50%" stop-color="#0b0710"/>
      <stop offset="100%" stop-color="#030205"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <ellipse cx="400" cy="510" rx="280" ry="35" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="200" ry="18" fill="#a855f7" opacity="0.1" filter="url(#glowFilt)"/>

  <!-- Speed Jump Rope Loops and Handles -->
  <g id="jumpRope" transform="translate(400, 270)">
    <!-- Shadow -->
    <path d="M -160,180 C -60,240 60,240 160,180" stroke="#000000" stroke-width="12" opacity="0.4" fill="none"/>

    <!-- Purple Neon Steel Cable Loops -->
    <!-- Large coiled loop -->
    <path d="M -140,-40 C -220,180 -100,220 0,160 C 100,100 220,180 140,-40"
          stroke="#c084fc" stroke-width="7" fill="none" stroke-linecap="round" filter="url(#glowFilt)"/>
    <path d="M -140,-40 C -220,180 -100,220 0,160 C 100,100 220,180 140,-40"
          stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Left Handle (Angled) -->
    <g transform="translate(-140, -40) rotate(-28)">
      <!-- Ball Bearing Collar -->
      <circle cx="0" cy="0" r="10" fill="#a855f7"/>
      <rect x="-8" y="-120" width="16" height="120" rx="5" fill="url(#handleMetal)" stroke="#334155" stroke-width="1.5"/>
      <!-- Knurled Silicone Grip -->
      <rect x="-7" y="-95" width="14" height="70" rx="3" fill="#0f172a"/>
      <line x1="-7" y1="-80" x2="7" y2="-80" stroke="#a855f7" stroke-width="2"/>
      <line x1="-7" y1="-60" x2="7" y2="-60" stroke="#a855f7" stroke-width="2"/>
      <line x1="-7" y1="-40" x2="7" y2="-40" stroke="#a855f7" stroke-width="2"/>
      <!-- Top Cap -->
      <ellipse cx="0" cy="-120" rx="8" ry="4" fill="#c084fc"/>
    </g>

    <!-- Right Handle (Angled) -->
    <g transform="translate(140, -40) rotate(28)">
      <!-- Ball Bearing Collar -->
      <circle cx="0" cy="0" r="10" fill="#a855f7"/>
      <rect x="-8" y="-120" width="16" height="120" rx="5" fill="url(#handleMetal)" stroke="#334155" stroke-width="1.5"/>
      <!-- Knurled Silicone Grip -->
      <rect x="-7" y="-95" width="14" height="70" rx="3" fill="#0f172a"/>
      <line x1="-7" y1="-80" x2="7" y2="-80" stroke="#a855f7" stroke-width="2"/>
      <line x1="-7" y1="-60" x2="7" y2="-60" stroke="#a855f7" stroke-width="2"/>
      <line x1="-7" y1="-40" x2="7" y2="-40" stroke="#a855f7" stroke-width="2"/>
      <!-- Top Cap -->
      <ellipse cx="0" cy="-120" rx="8" ry="4" fill="#c084fc"/>
    </g>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#110519" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="2">SPEED JUMP ROPE</text>
  </g>
</svg>
