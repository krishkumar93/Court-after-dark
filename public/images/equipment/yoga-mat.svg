<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419"/>
      <stop offset="50%" stop-color="#030d12"/>
      <stop offset="100%" stop-color="#010406"/>
    </linearGradient>
    <radialGradient id="matGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="40%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#matGlow)"/>

  <ellipse cx="400" cy="505" rx="300" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="500" rx="220" ry="20" fill="#14b8a6" opacity="0.1" filter="url(#glow)"/>

  <!-- Rolled Yoga Mat with Carrying Strap -->
  <g id="yogaMat" transform="translate(400, 290) rotate(-16)">
    <!-- Shadow -->
    <rect x="-210" y="30" width="420" height="70" rx="35" fill="#000000" opacity="0.45"/>

    <!-- Cylindrical Body -->
    <rect x="-190" y="-55" width="380" height="110" rx="8" fill="url(#matTeal)" stroke="#0f766e" stroke-width="2"/>

    <!-- Texture Ribs / Grooves across mat surface -->
    <g stroke="#0f766e" stroke-width="1.5" opacity="0.6">
      <line x1="-150" y1="-55" x2="-150" y2="55"/>
      <line x1="-110" y1="-55" x2="-110" y2="55"/>
      <line x1="-70" y1="-55" x2="-70" y2="55"/>
      <line x1="-30" y1="-55" x2="-30" y2="55"/>
      <line x1="10" y1="-55" x2="10" y2="55"/>
      <line x1="50" y1="-55" x2="50" y2="55"/>
      <line x1="90" y1="-55" x2="90" y2="55"/>
      <line x1="130" y1="-55" x2="130" y2="55"/>
      <line x1="170" y1="-55" x2="170" y2="55"/>
    </g>

    <!-- Top Highlight Sheen -->
    <line x1="-185" y1="-35" x2="185" y2="-35" stroke="#ffffff" stroke-width="3" opacity="0.4" filter="url(#glow)"/>

    <!-- Left Roll Spiral End -->
    <ellipse cx="-190" cy="0" rx="35" ry="55" fill="#115e59" stroke="#042f2e" stroke-width="3"/>
    <ellipse cx="-190" cy="0" rx="26" ry="42" fill="#0d9488" stroke="#042f2e" stroke-width="2"/>
    <ellipse cx="-190" cy="0" rx="16" ry="26" fill="#115e59" stroke="#042f2e" stroke-width="2"/>
    <ellipse cx="-190" cy="0" rx="7" ry="12" fill="#042f2e"/>

    <!-- Right Roll Outer Lip -->
    <ellipse cx="190" cy="0" rx="35" ry="55" fill="url(#matTeal)" stroke="#0f766e" stroke-width="2"/>

    <!-- Black Webbing Carrying Straps -->
    <!-- Left Strap -->
    <rect x="-90" y="-62" width="22" height="124" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Right Strap -->
    <rect x="70" y="-62" width="22" height="124" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Connecting Shoulder Sling Strap -->
    <path d="M -80,-62 C -40,-130 40,-130 80,-62" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
    <path d="M -80,-62 C -40,-130 40,-130 80,-62" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#041215" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#2dd4bf" text-anchor="middle" letter-spacing="2">HIGH-GRIP YOGA MAT</text>
  </g>
</svg>
