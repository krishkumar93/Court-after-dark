<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f06"/>
      <stop offset="50%" stop-color="#0c0903"/>
      <stop offset="100%" stop-color="#040301"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodStump" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="40%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <ellipse cx="400" cy="510" rx="280" ry="40" fill="#000000" opacity="0.6"/>
  <ellipse cx="400" cy="505" rx="200" ry="20" fill="#f59e0b" opacity="0.1"/>

  <!-- Three Hardwood Stumps and Two Bails on Spring Base -->
  <g id="stumps" transform="translate(400, 270)">
    <!-- Base Plate (Cast Iron Spring Base) -->
    <rect x="-110" y="190" width="220" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="-65" cy="202" r="8" fill="#475569"/>
    <circle cx="0" cy="202" r="8" fill="#475569"/>
    <circle cx="65" cy="202" r="8" fill="#475569"/>

    <!-- Left Stump (Off/Leg) -->
    <rect x="-73" y="-140" width="16" height="330" rx="5" fill="url(#woodStump)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="-65" y1="-140" x2="-65" y2="190" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <ellipse cx="-65" cy="-140" rx="8" ry="4" fill="#fef3c7"/>

    <!-- Middle Stump -->
    <rect x="-8" y="-140" width="16" height="330" rx="5" fill="url(#woodStump)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="0" y1="-140" x2="0" y2="190" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <ellipse cx="0" cy="-140" rx="8" ry="4" fill="#fef3c7"/>

    <!-- Right Stump -->
    <rect x="57" y="-140" width="16" height="330" rx="5" fill="url(#woodStump)" stroke="#78350f" stroke-width="1.5"/>
    <line x1="65" y1="-140" x2="65" y2="190" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <ellipse cx="65" cy="-140" rx="8" ry="4" fill="#fef3c7"/>

    <!-- Left Bail -->
    <rect x="-70" y="-154" width="72" height="12" rx="4" fill="url(#woodStump)" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="-70" cy="-148" rx="4" ry="6" fill="#92400e"/>
    <ellipse cx="2" cy="-148" rx="4" ry="6" fill="#92400e"/>

    <!-- Right Bail -->
    <rect x="-2" y="-154" width="72" height="12" rx="4" fill="url(#woodStump)" stroke="#78350f" stroke-width="1.5"/>
    <ellipse cx="-2" cy="-148" rx="4" ry="6" fill="#92400e"/>
    <ellipse cx="70" cy="-148" rx="4" ry="6" fill="#92400e"/>
  </g>

  <!-- Modern Sport Badge Pill -->
  <g transform="translate(400, 520)">
    <rect x="-120" y="-18" width="240" height="36" rx="18" fill="#140a02" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="2">CRICKET WICKET STUMPS</text>
  </g>
</svg>
